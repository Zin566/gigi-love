<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <title>ဂီဂီကိုချစ်တယ်</title>
  <style>
    body {
      background: linear-gradient(to right, #ffdde1, #ee9ca7);
      font-family: "Noto Sans Myanmar", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      color: #fff;
    }
    h1 {
      font-size: 48px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    .heart {
      font-size: 80px;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    .footer {
      margin-top: 20px;
      font-size: 18px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="heart">❤️</div>
  <h1>ဂီဂီကို ချစ်တယ်</h1>
  <div class="footer">ဒီစာမျက်နှာကို ကိုဇင်ကဖန်တီးပါတယ်။</div>
</body>
</html>
